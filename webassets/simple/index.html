<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#006a6a">
<title>简洁版</title>
<style>
/* ================= Material 3 · Teal 设计令牌 =================
   从 Teal 种子生成的 M3 色料角色（light/dark 两套），外加 shape / elevation /
   state layer / typography。全部用 CSS 自定义属性，组件只认角色名不认具体色值。 */
:root{
  /* =====================================================================
     Material 3 · Teal —— 令牌层遵循 m3.material.io/develop/web 的三层结构：
       1) --md-ref-palette-*  参考调色板（种子生成的 0→100 色调，主题无关）
       2) --md-sys-*          系统角色：color / typescale / shape / elevation /
                              state / motion 六族；浅色在此定义，[data-theme=dark] 覆盖
       3) 组件只读系统角色；文件尾再放一组简写别名（--primary 等）指回 --md-sys-*，
          让既有组件 CSS 与 JS 无需改写即可跟随主题（深色翻牌只改角色，别名不动）。
     ===================================================================== */

  /* —— 1. 参考调色板：Teal 主色 + 低饱和辅色 + 蓝灰第三色 + 中性 / 中性变体 + 错误 —— */
  --md-ref-palette-primary0:#000000;   --md-ref-palette-primary10:#002020;
  --md-ref-palette-primary20:#003737;  --md-ref-palette-primary30:#004f4f;
  --md-ref-palette-primary40:#006a6a;  --md-ref-palette-primary50:#008786;
  --md-ref-palette-primary60:#14a3a0;  --md-ref-palette-primary70:#33bfbb;
  --md-ref-palette-primary80:#4cd9d5;  --md-ref-palette-primary90:#6ff7f3;
  --md-ref-palette-primary95:#a9fdfa;  --md-ref-palette-primary99:#e6fffe; --md-ref-palette-primary100:#ffffff;
  --md-ref-palette-secondary10:#192020; --md-ref-palette-secondary20:#2e3535;
  --md-ref-palette-secondary30:#3f4948; --md-ref-palette-secondary40:#4a6363;
  --md-ref-palette-secondary80:#b1cccb; --md-ref-palette-secondary90:#cde8e7; --md-ref-palette-secondary100:#ffffff;
  --md-ref-palette-tertiary10:#141e2b;  --md-ref-palette-tertiary20:#20304a;
  --md-ref-palette-tertiary30:#354661;  --md-ref-palette-tertiary40:#4d5d7c;
  --md-ref-palette-tertiary80:#b6c6ea;  --md-ref-palette-tertiary90:#d3e2ff; --md-ref-palette-tertiary100:#ffffff;
  --md-ref-palette-neutral4:#131516;  --md-ref-palette-neutral6:#17191b;
  --md-ref-palette-neutral10:#1b1d1f; --md-ref-palette-neutral12:#222427;
  --md-ref-palette-neutral17:#2b2e31; --md-ref-palette-neutral20:#33363a;
  --md-ref-palette-neutral22:#3a3e42; --md-ref-palette-neutral90:#e1e3e6;
  --md-ref-palette-neutral92:#e8eaed; --md-ref-palette-neutral94:#eef0f2;
  --md-ref-palette-neutral95:#f2f4f6; --md-ref-palette-neutral96:#f6f7f9;
  --md-ref-palette-neutral98:#fafbfc; --md-ref-palette-neutral100:#ffffff;
  --md-ref-palette-neutral-variant20:#33363a; --md-ref-palette-neutral-variant25:#3d4145;
  --md-ref-palette-neutral-variant30:#484c50; --md-ref-palette-neutral-variant50:#6d7277;
  --md-ref-palette-neutral-variant60:#878c91; --md-ref-palette-neutral-variant80:#c3c7cb;
  --md-ref-palette-neutral-variant90:#dfe2e5; --md-ref-palette-neutral-variant95:#eef0f2;
  --md-ref-palette-error10:#410e0b;  --md-ref-palette-error20:#691d16;
  --md-ref-palette-error30:#93000a;  --md-ref-palette-error40:#b3261e;
  --md-ref-palette-error80:#ffb4ab;  --md-ref-palette-error90:#ffdad6; --md-ref-palette-error100:#ffffff;

  /* —— 2a. 系统 · 颜色角色（浅色）—— */
  --md-sys-color-primary:var(--md-ref-palette-primary40);
  --md-sys-color-on-primary:var(--md-ref-palette-primary100);
  --md-sys-color-primary-container:var(--md-ref-palette-primary90);
  --md-sys-color-on-primary-container:var(--md-ref-palette-primary10);
  --md-sys-color-secondary:var(--md-ref-palette-secondary40);
  --md-sys-color-on-secondary:var(--md-ref-palette-secondary100);
  --md-sys-color-secondary-container:var(--md-ref-palette-secondary90);
  --md-sys-color-on-secondary-container:#051f1f;
  --md-sys-color-tertiary:var(--md-ref-palette-tertiary40);
  --md-sys-color-on-tertiary:var(--md-ref-palette-tertiary100);
  --md-sys-color-tertiary-container:var(--md-ref-palette-tertiary90);
  --md-sys-color-on-tertiary-container:var(--md-ref-palette-tertiary10);
  --md-sys-color-error:var(--md-ref-palette-error40);
  --md-sys-color-on-error:var(--md-ref-palette-error100);
  --md-sys-color-error-container:var(--md-ref-palette-error90);
  --md-sys-color-on-error-container:var(--md-ref-palette-error10);
  --md-sys-color-surface:var(--md-ref-palette-neutral98);
  --md-sys-color-on-surface:var(--md-ref-palette-neutral10);
  --md-sys-color-background:var(--md-ref-palette-neutral95);
  --md-sys-color-surface-variant:var(--md-ref-palette-neutral-variant90);
  --md-sys-color-on-surface-variant:var(--md-ref-palette-neutral-variant25);
  --md-sys-color-surface-container-lowest:var(--md-ref-palette-neutral100);
  --md-sys-color-surface-container-low:var(--md-ref-palette-neutral96);
  --md-sys-color-surface-container:var(--md-ref-palette-neutral94);
  --md-sys-color-surface-container-high:var(--md-ref-palette-neutral92);
  --md-sys-color-surface-container-highest:var(--md-ref-palette-neutral90);
  --md-sys-color-outline:var(--md-ref-palette-neutral-variant50);
  --md-sys-color-outline-variant:var(--md-ref-palette-neutral-variant80);
  --md-sys-color-scrim:rgba(0,0,0,.42);

  /* —— 2b. 系统 · 排版 typescale —— */
  --md-sys-typescale-font:Roboto,"Segoe UI Variable","Segoe UI",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  --md-sys-typescale-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --md-sys-typescale-body-small-size:12px;   --md-sys-typescale-body-small-line:16px;
  --md-sys-typescale-body-medium-size:14px;  --md-sys-typescale-body-medium-line:20px;
  --md-sys-typescale-body-large-size:16px;   --md-sys-typescale-body-large-line:24px;
  --md-sys-typescale-label-small-size:11px;  --md-sys-typescale-label-medium-size:12px; --md-sys-typescale-label-large-size:14px;
  --md-sys-typescale-title-small-size:14px;  --md-sys-typescale-title-medium-size:16px; --md-sys-typescale-title-large-size:22px;
  --md-sys-typescale-headline-small-size:24px; --md-sys-typescale-display-small-size:36px;

  /* —— 2c. 系统 · 形状 shape（桌面 Web 风：圆角收紧、更方正；pill 仅留给开关、进度条、状态标签等）—— */
  --md-sys-shape-corner-extra-small:4px; --md-sys-shape-corner-small:8px;
  --md-sys-shape-corner-medium:10px;     --md-sys-shape-corner-large:12px;
  --md-sys-shape-corner-extra-large:16px; --md-sys-shape-corner-full:999px;

  /* —— 2d. 系统 · 高度 elevation（中性灰阴影、更轻，贴近 Web）—— */
  --md-sys-elevation-level0:none;
  --md-sys-elevation-level1:0 1px 2px rgba(33,37,41,.14),0 1px 3px 1px rgba(33,37,41,.06);
  --md-sys-elevation-level2:0 1px 3px rgba(33,37,41,.12),0 2px 6px 2px rgba(33,37,41,.07);
  --md-sys-elevation-level3:0 4px 10px 3px rgba(33,37,41,.10),0 2px 4px rgba(33,37,41,.08);
  --md-sys-elevation-level4:0 6px 14px 4px rgba(33,37,41,.10),0 3px 6px rgba(33,37,41,.08);
  --md-sys-elevation-level5:0 10px 20px 6px rgba(33,37,41,.12),0 4px 8px rgba(33,37,41,.10);

  /* —— 2e. 系统 · 状态层 state —— */
  --md-sys-state-hover-opacity:.08; --md-sys-state-focus-opacity:.10;
  --md-sys-state-pressed-opacity:.12; --md-sys-state-drag-opacity:.16;

  /* —— 2f. 系统 · 动效 motion（标准 / 强调缓动 + 时长刻度）—— */
  --md-sys-motion-easing-standard:cubic-bezier(.2,0,0,1);
  --md-sys-motion-easing-standard-decelerate:cubic-bezier(0,0,0,1);
  --md-sys-motion-easing-standard-accelerate:cubic-bezier(.3,0,1,1);
  --md-sys-motion-easing-emphasized:cubic-bezier(.05,.7,.1,1);
  --md-sys-motion-easing-emphasized-accelerate:cubic-bezier(.3,0,.8,.15);
  --md-sys-motion-easing-legacy:cubic-bezier(.4,0,.2,1);
  --md-sys-motion-duration-short2:100ms; --md-sys-motion-duration-short3:150ms; --md-sys-motion-duration-short4:200ms;
  --md-sys-motion-duration-medium1:250ms; --md-sys-motion-duration-medium2:300ms; --md-sys-motion-duration-medium4:400ms;
  --md-sys-motion-duration-long2:450ms;

  /* —— 3. 简写别名：组件 / JS 用短名，全部指回系统角色 → 深色自动跟随 —— */
  --primary:var(--md-sys-color-primary); --on-primary:var(--md-sys-color-on-primary);
  --primary-container:var(--md-sys-color-primary-container); --on-primary-container:var(--md-sys-color-on-primary-container);
  --secondary:var(--md-sys-color-secondary); --on-secondary:var(--md-sys-color-on-secondary);
  --secondary-container:var(--md-sys-color-secondary-container); --on-secondary-container:var(--md-sys-color-on-secondary-container);
  --tertiary:var(--md-sys-color-tertiary); --on-tertiary:var(--md-sys-color-on-tertiary); --tertiary-container:var(--md-sys-color-tertiary-container);
  --error:var(--md-sys-color-error); --on-error:var(--md-sys-color-on-error);
  --error-container:var(--md-sys-color-error-container); --on-error-container:var(--md-sys-color-on-error-container);
  --surface:var(--md-sys-color-surface); --on-surface:var(--md-sys-color-on-surface);
  --surface-variant:var(--md-sys-color-surface-variant); --on-surface-variant:var(--md-sys-color-on-surface-variant);
  --surface-1:var(--md-sys-color-surface-container-low); --surface-2:var(--md-sys-color-surface-container);
  --surface-3:var(--md-sys-color-surface-container-high); --surface-4:var(--md-sys-color-surface-container-highest); --surface-5:var(--md-sys-color-surface-container-highest);
  --surface-container:var(--md-sys-color-surface-container); --surface-container-high:var(--md-sys-color-surface-container-high);
  --surface-container-highest:var(--md-sys-color-surface-container-highest); --surface-container-low:var(--md-sys-color-surface-container-low);
  --outline:var(--md-sys-color-outline); --outline-variant:var(--md-sys-color-outline-variant); --scrim:var(--md-sys-color-scrim);
  --bg:var(--md-sys-color-background);
  --r-xs:var(--md-sys-shape-corner-extra-small); --r-s:var(--md-sys-shape-corner-small); --r-m:var(--md-sys-shape-corner-medium);
  --r-l:var(--md-sys-shape-corner-large); --r-xl:var(--md-sys-shape-corner-extra-large); --r-full:var(--md-sys-shape-corner-full);
  --sl-hover:var(--md-sys-state-hover-opacity); --sl-focus:var(--md-sys-state-focus-opacity); --sl-press:var(--md-sys-state-pressed-opacity);
  --e1:var(--md-sys-elevation-level1); --e2:var(--md-sys-elevation-level2); --e3:var(--md-sys-elevation-level3);
  --font:var(--md-sys-typescale-font); --mono:var(--md-sys-typescale-mono);
  /* —— 3b. 压缩字号刻度：7 级，12→20px（最大跨度仅 1.67x），收敛原先 11/12.5/22/26 等零散值 —— */
  --fs-1:12px; --fs-2:13px; --fs-3:14px; --fs-4:15px; --fs-5:16px; --fs-6:18px; --fs-7:20px;
  /* —— 3c. 语义“成功/在线”胶囊（与主题无关的固定 teal，不随翻牌变暗）—— */
  --ok-bg:var(--md-ref-palette-primary30); --ok-fg:var(--md-ref-palette-primary90);
  /* —— 3d. 负载曲线三色（主题感知：深色下换更亮色调，保证与深底 ≥ 3:1）—— */
  --chart-1:var(--md-ref-palette-primary40); --chart-2:var(--md-ref-palette-primary60); --chart-3:var(--md-ref-palette-tertiary40);
}
[data-theme="dark"]{
  /* 只翻系统颜色角色与高度；上面的简写别名保持不动 → 全站随主题一起翻转 */
  --md-sys-color-primary:var(--md-ref-palette-primary80);
  --md-sys-color-on-primary:var(--md-ref-palette-primary20);
  --md-sys-color-primary-container:var(--md-ref-palette-primary30);
  --md-sys-color-on-primary-container:var(--md-ref-palette-primary90);
  --md-sys-color-secondary:var(--md-ref-palette-secondary80);
  --md-sys-color-on-secondary:var(--md-ref-palette-secondary20);
  --md-sys-color-secondary-container:var(--md-ref-palette-secondary30);
  --md-sys-color-on-secondary-container:var(--md-ref-palette-secondary90);
  --md-sys-color-tertiary:var(--md-ref-palette-tertiary80);
  --md-sys-color-on-tertiary:var(--md-ref-palette-tertiary20);
  --md-sys-color-tertiary-container:var(--md-ref-palette-tertiary30);
  --md-sys-color-on-tertiary-container:var(--md-ref-palette-tertiary90);
  --md-sys-color-error:var(--md-ref-palette-error80);
  --md-sys-color-on-error:var(--md-ref-palette-error20);
  --md-sys-color-error-container:var(--md-ref-palette-error30);
  --md-sys-color-on-error-container:var(--md-ref-palette-error90);
  --md-sys-color-surface:var(--md-ref-palette-neutral6);
  --md-sys-color-on-surface:var(--md-ref-palette-neutral90);
  --md-sys-color-background:#101214;
  --md-sys-color-surface-variant:var(--md-ref-palette-neutral-variant30);
  --md-sys-color-on-surface-variant:var(--md-ref-palette-neutral-variant80);
  --md-sys-color-surface-container-lowest:var(--md-ref-palette-neutral4);
  --md-sys-color-surface-container-low:var(--md-ref-palette-neutral10);
  --md-sys-color-surface-container:var(--md-ref-palette-neutral12);
  --md-sys-color-surface-container-high:var(--md-ref-palette-neutral17);
  --md-sys-color-surface-container-highest:var(--md-ref-palette-neutral22);
  --md-sys-color-outline:var(--md-ref-palette-neutral-variant60);
  --md-sys-color-outline-variant:var(--md-ref-palette-neutral-variant25);
  --md-sys-elevation-level1:0 1px 2px rgba(0,0,0,.4),0 1px 3px 1px rgba(0,0,0,.3);
  --md-sys-elevation-level2:0 1px 3px rgba(0,0,0,.45),0 2px 8px 2px rgba(0,0,0,.32);
  --md-sys-elevation-level3:0 5px 12px 3px rgba(0,0,0,.36),0 2px 5px rgba(0,0,0,.45);
  --md-sys-elevation-level4:0 8px 16px 4px rgba(0,0,0,.36),0 3px 6px rgba(0,0,0,.45);
  --md-sys-elevation-level5:0 12px 22px 8px rgba(0,0,0,.4),0 4px 8px rgba(0,0,0,.45);
  /* 深色下曲线取更亮色调（primary60/80、tertiary80），避免 2.8:1 偏暗 */
  --chart-1:var(--md-ref-palette-primary60); --chart-2:var(--md-ref-palette-primary80); --chart-3:var(--md-ref-palette-tertiary80);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--on-surface);font:400 15px/1.6 var(--font);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3{margin:0;font-weight:500}
a{color:inherit}
/* ================= 布局：导航抽屉 + 应用栏 + 内容 ================= */
.layout{display:flex;min-height:100vh;max-width:1240px;margin:0 auto}
.nav{width:264px;flex:none;background:var(--surface);border-right:1px solid var(--outline-variant);
  padding:16px 12px;display:flex;flex-direction:column;gap:2px}
.nav .brand{display:flex;align-items:center;gap:12px;padding:8px 12px 18px}
.nav .logo{width:40px;height:40px;border-radius:var(--r-m);background:var(--primary);color:var(--on-primary);
  display:grid;place-items:center;font-weight:700;font-size:var(--fs-6);box-shadow:var(--e1)}
.nav .brand .t{font-size:var(--fs-4);font-weight:600;line-height:1.2}
.nav .brand .s{font-size:var(--fs-1);color:var(--on-surface-variant)}
.nav .sec{font-size:var(--fs-1);letter-spacing:.04em;text-transform:uppercase;color:var(--on-surface-variant);padding:14px 16px 6px}
.nav a.item{position:relative;display:flex;align-items:center;gap:14px;padding:0 16px;height:44px;
  border-radius:var(--r-s);color:var(--on-surface-variant);text-decoration:none;font-size:var(--fs-3);
  cursor:pointer;overflow:hidden;transition:background var(--md-sys-motion-duration-short3) var(--md-sys-motion-easing-standard),color var(--md-sys-motion-duration-short3) var(--md-sys-motion-easing-standard)}
.nav a.item .ic{width:22px;text-align:center;font-size:var(--fs-6)}
.nav a.item:hover{background:color-mix(in srgb,var(--on-surface-variant) calc(var(--sl-hover)*100%),transparent)}
.nav a.item.on{background:var(--secondary-container);color:var(--on-secondary-container);font-weight:600}
.nav a.item .chev{margin-left:auto;display:inline-flex;align-self:center;color:var(--primary);opacity:0;transform:translateX(-4px);transition:opacity var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-emphasized),transform var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-emphasized)}
.nav a.item.on .chev{opacity:1;transform:none}
.nav a.item.soon{color:var(--on-surface-variant);opacity:.6}
.nav .foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--outline-variant)}
.content{flex:1;min-width:0;display:flex;flex-direction:column}
.appbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:64px;padding:0 20px;
  background:var(--surface);color:var(--on-surface);transition:box-shadow var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard),background var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard)}
.appbar.elev{box-shadow:var(--e2);background:var(--surface-container)}
.appbar .menu-btn{display:none}
.appbar h1{font-size:var(--fs-6);flex:1;font-weight:400;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .actions{display:flex;align-items:center;gap:4px}
main{padding:22px 20px 72px;flex:1}
/* ================= 卡片 ================= */
.card{background:var(--surface-container-low,--surface-1);background:var(--surface);border-radius:var(--r-l);
  padding:18px;margin-bottom:14px;box-shadow:var(--e1);border:1px solid var(--outline-variant)}
.card.filled{background:var(--surface-container);border-color:transparent;box-shadow:none}
.card > h2{font-size:var(--fs-5);font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:10px}
.card > .sub{font-size:var(--fs-2);color:var(--on-surface-variant);margin:-2px 0 16px}
.card h3{font-size:var(--fs-3);font-weight:600;color:var(--on-surface-variant);margin:18px 0 8px;letter-spacing:.02em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.kv{background:var(--surface-1);border:1px solid var(--outline-variant);border-radius:var(--r-m);padding:12px 14px}
.kv .k{font-size:var(--fs-1);color:var(--on-surface-variant);letter-spacing:.02em}
.kv .v{font-size:var(--fs-6);font-weight:600;margin-top:3px;word-break:break-all}
.kv .v.sm{font-size:var(--fs-4)}
/* ================= 表单：M3 描边输入（浮动标签 + 帮助/错误） ================= */
.field{position:relative;margin:14px 0 0}
.field .control{display:flex;align-items:center;gap:8px}
.field input,.field select,.field textarea{width:100%;font:inherit;color:var(--on-surface);background:transparent;
  border:1px solid var(--outline);border-radius:var(--r-s);padding:18px 14px 8px;outline:0;transition:border-color var(--md-sys-motion-duration-short3) var(--md-sys-motion-easing-standard),box-shadow var(--md-sys-motion-duration-short3) var(--md-sys-motion-easing-standard)}
.field select{cursor:pointer;appearance:none;padding-right:34px}
.field textarea{padding-top:16px;resize:vertical;min-height:96px;font-family:var(--mono);font-size:var(--fs-2)}
.field .control::after{content:"▾";position:absolute;right:14px;top:14px;color:var(--on-surface-variant);
  pointer-events:none;font-size:var(--fs-1)}
.field.nochev .control::after{content:""}
.field input:hover,.field select:hover,.field textarea:hover{border-color:var(--on-surface)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}

    st.busyPw=true;m.redraw();
    var p=new URLSearchParams();p.set("username","root");p.set("old",st.old);p.set("new",st.nw1);p.set("next","#/sys");
    fetch("/auth/password",{method:"POST",body:p,redirect:"follow"}).then(function(r){
      var ok=r.url.indexOf("auth_error")<0,code=(/[?&]auth_error=([a-z_]+)/.exec(r.url)||[])[1];
      if(ok){toast("口令已更新");st.old="";st.nw1="";}
      else st.__e={old:"失败："+({bad_credentials:"旧口令不对",weak_password:"新口令太短（至少 5 个字符）",no_hasher:"设备缺少 openssl，无法生成 hash"}[code]||"未知错误")};
      st.busyPw=false;m.redraw();}).catch(function(e){toast("提交失败："+e.message,"err");st.busyPw=false;m.redraw();});}
  return {view:function(){
    return m("div",[
      m("section.card",m("h2","重启设备"),
        m(".sub","重启约需 1–2 分钟，期间网络会中断。"),
        m(".row",Btn({label:"立即重启",variant:"danger",busy:st.rb,onclick:reboot}))),
      m("section.card",m("h2","修改 root 口令"),

    ]);
  }};
};

/* ---- 日志：走 ubus 的 log.read（rpcd 日志对象）；级别/子串/行数过滤 ---- */
PAGES.log=function(){
  var st={lines:"200",filter:"",level:"",text:"读取中…",err:""};
  var f=mkf(st);
  function LOGP(x){var t=x&&x.time?new Date(x.time).toISOString().replace("T"," ").slice(0,19):"";
    var s=x&&x.priority!=null?(x.priority&7):null;var lv=s==null?"":["emerg","alert","crit","err","warn","notice","info","debug"][s];
    return (t+" ["+lv+"] "+(x&&x.msg||"")).replace(/\s+$/,"");}
  function go(){st.text="读取中…";st.err="";m.redraw();
    var n=Math.min(parseInt(st.lines,10)||200,2000);
    rpc("log","read",{stream:false,lines:n}).then(function(r){var items=(r&&r.log)||[];
      var cut={err:3,warn:4,notice:5,info:6}[st.level];if(cut!=null)items=items.filter(function(x){return x.priority!=null&&(x.priority&7)<=cut;});
      var lines=items.map(LOGP);var fl=st.filter.trim();if(fl)lines=lines.filter(function(l){return l.indexOf(fl)>=0;});
      st.text=lines.reverse().join("\n")||"(没有匹配的日志行)";m.redraw();})
      .catch(function(e){st.text="";st.err="读不到系统日志："+e.message+"（需要 log.read 的 ACL）";m.redraw();});}
  return {oninit:go,view:function(){
    return m("div",m("section.card",m("h2","系统日志"),
      m(".grid",f("filter","过滤（子串，留空看全部）"),f("lines","行数",{mode:"numeric"}),
        f("level","最低级别",{sel:true,opts:[{v:"",l:"全部"},{v:"err",l:"err 及以上"},{v:"warn",l:"warn 及以上"},{v:"notice",l:"notice 及以上"},{v:"info",l:"info 及以上"}]})),
      st.err?m(".msg-inline","✕ "+st.err):null,
      m(".row",Btn({label:"刷新",onclick:go})),
      m("pre",{style:"margin-top:12px"},st.text)));
  }};
};

/* ---- 存储：挂载表来自 file read /proc/mounts；容量来自 file exec /bin/df -k ---- */
PAGES.disk=function(){
  var st={mounts:[],df:[],err:"",loadedM:false,loadedD:false};
  function load(){
    rpc("file","read",{path:"/proc/mounts"}).then(function(r){var ls=((r&&r.data)||"").trim().split("\n").map(function(l){var p=l.split(/\s+/);return{dev:p[0],mnt:p[1],type:p[2]};})
      .filter(function(x){return x.mnt&&["proc","sysfs","devtmpfs","tmpfs","devpts","cgroup","debugfs","mqueue","hugetlbfs"].indexOf(x.type)<0&&x.mnt.indexOf("/dev/")!==0;});
      st.mounts=ls;st.loadedM=true;m.redraw();}).catch(function(e){st.err="挂载表："+e.message;st.loadedM=true;m.redraw();});
    rpc("file","exec",{command:"/bin/df",params:["-k"]}).then(function(r){var ls=((r&&r.stdout)||"").trim().split("\n").slice(1).map(function(l){var p=l.trim().split(/\s+/);return{mnt:p[5],tot:+p[1]||0,use:+p[2]||0,avail:+p[3]||0};}).filter(function(x){return x.mnt;});
      st.df=ls;st.loadedD=true;m.redraw();}).catch(function(e){st.err=(st.err?st.err+" · ":"")+"读容量失败："+e.message+"（需在 acl.d 放行 /bin/df）";st.loadedD=true;m.redraw();});
  }
  return {oninit:load,view:function(){
    var mrows=st.mounts.length?st.mounts.map(function(x){return m("tr",m("td.mono",x.dev),m("td.mono",x.mnt),m("td.mono",x.type));}):[m("tr",m("td.empty",{colspan:"3"},st.loadedM?"暂无":"读取中…"))];
    var drows=st.df.length?st.df.map(function(x){var pct=x.tot?Math.round(x.use/x.tot*100):0;return m("tr",m("td.mono",x.mnt),m("td",fmtBytes(x.tot*1024)),m("td",fmtBytes(x.use*1024)),m("td",fmtBytes(x.avail*1024)),m("td",{style:"min-width:90px"},m(".bar",m("i",{style:"width:"+pct+"%"}))));}):[m("tr",m("td.empty",{colspan:"5"},st.loadedD?(st.err?"df 不可用":"暂无"):"读取中…"))];
    return m("div",[
      m("section.card",m("h2","挂载点"),
        m("table",[m("thead",m("tr",m("th","设备"),m("th","挂载点"),m("th","类型"))),m("tbody",mrows)])),
      m("section.card",m("h2","容量"),
        m("table",[m("thead",m("tr",m("th","挂载点"),m("th","总量"),m("th","已用"),m("th","可用"),m("th",""))),m("tbody",drows)]),
        st.err?m(".msg-inline","✕ "+st.err):null)
    ]);
  }};
};

/* ---- 服务：/etc/rc.d 里的 S* 链接 = 已注册开机自启项；启停与自启都走 init 脚本（file exec） ---- */
PAGES.svc=function(){
  var st={filter:"",all:[],busy:{},loaded:false};
  function act0(a){return {start:"启动",stop:"停止",restart:"重载",enable:"开自启",disable:"停自启"}[a]||a;}
  function load(){rpc("file","list",{path:"/etc/rc.d"}).then(function(r){var names=((r&&r.entries)||[]).map(function(e){return (typeof e==="string")?e:((e&&e.name)||"");})
      .filter(function(n){return /^S\d+/.test(n);}).map(function(n){return n.replace(/^S\d+/,"");}).filter(function(n){return n&&n!=="molly";}).sort();
      st.all=names.map(function(n){return{name:n,enabled:true};});st.loaded=true;m.redraw();})
      .catch(function(e){st.all=[];st.loaded=true;toast("读取服务失败："+e.message,"err");});}
  function run(s,a){st.busy[s+"_"+a]=true;m.redraw();
    rpc("file","exec",{command:"/etc/init.d/"+s,params:[a]}).then(function(){toast(s+" "+act0(a)+" 已执行");return load();})
      .catch(function(e){toast(s+" "+act0(a)+" 失败："+e.message,"err");})
      .then(function(){st.busy[s+"_"+a]=false;m.redraw();});}
  function ask(s,a){if(a==="start"){run(s,a);return;}
    confirmDialog({title:act0(a),message:"确定对 "+s+" 执行「"+act0(a)+"」？",danger:(a==="stop"),ok:act0(a)}).then(function(y){if(y)run(s,a);});}
  return {oninit:load,view:function(){
    var flt=st.filter.trim();var ls=st.all.filter(function(x){return !flt||x.name.indexOf(flt)>=0;});
    return m("div",m("section.card",m("h2",Ico("power"),"服务进程",m("span.tag",st.all.length+" 个")),
      m(".searchbox",Ico("search",18),
        m("input",{type:"text",placeholder:"搜索服务名…",value:st.filter,oninput:function(e){st.filter=e.target.value;m.redraw();}}),
        st.filter?IconBtn({ic:"close",title:"清除",size:16,onclick:function(){st.filter="";m.redraw();}}):null),
      ls.length?m(".rows",ls.map(function(x){var b=st.busy;return m(".lrow",{key:x.name},
        m(".lico.on",Ico("power",20)),
        m(".lmain",m(".lt",x.name),m(".lm",x.enabled?"开机自启":"手动启动")),
        m(".lact",
          IconBtn({ic:"play",title:"启动",busy:b[x.name+"_start"],onclick:function(){ask(x.name,"start");}}),
          IconBtn({ic:"refresh",title:"重载",busy:b[x.name+"_restart"],onclick:function(){ask(x.name,"restart");}}),
          IconBtn({ic:"stop",title:"停止",busy:b[x.name+"_stop"],onclick:function(){ask(x.name,"stop");}})),
        Switch({checked:x.enabled,onchange:function(){ask(x.name,x.enabled?"disable":"enable");}}));})):m(".empty",st.loaded?"没有匹配的服务":"读取中…"),
      m(".row",Btn({icon:"refresh",label:"刷新列表",variant:"out",onclick:load}))));
  }};
};

/* ---- 网络诊断：ping / traceroute / nslookup / wget 走 file exec（acl.d 授权） ---- */
PAGES.diag=function(){
  var st={__e:{},tool:"ping",host:"223.5.5.5",extra:"",busy:false,out:"结果会显示在这里。"};
  var f=mkf(st);
  var BIN={ping:"/bin/ping",traceroute:"/usr/sbin/traceroute",nslookup:"/usr/bin/nslookup",wget:"/usr/bin/wget"};
  function run(){if(!(st.host||"").trim()){st.__e={host:"请填目标主机"};m.redraw();return;}
    var tool=st.tool,host=st.host.trim(),ex=(st.extra||"").trim(),args;
    if(tool==="ping")args=["-c",ex||"4",host];else if(tool==="traceroute")args=["-n",host];else if(tool==="nslookup")args=[host];else args=["-O","-","--timeout=10",host];
    st.busy=true;st.out="执行中…";m.redraw();
    rpc("file","exec",{command:BIN[tool],params:args}).then(function(r){var out=((r&&r.stdout)||"")+((r&&r.stderr)||"");st.out=(out||"").trim()||"(无输出，退出码 "+(r&&r.code)+")";m.redraw();})
      .catch(function(e){st.out="";toast("执行失败："+e.message+"（该命令需在 acl.d 放行）","err");m.redraw();})
      .then(function(){st.busy=false;m.redraw();});}
  return {view:function(){
    return m("div",m("section.card",m("h2","网络诊断"),
      m(".grid",f("host","目标主机",{help:"223.5.5.5 或 example.com"}),
        f("tool","工具",{sel:true,opts:[{v:"ping",l:"ping"},{v:"traceroute",l:"traceroute"},{v:"nslookup",l:"nslookup"},{v:"wget",l:"wget（取一个 URL）"}]}),
        f("extra","次数 / 参数（可选）",{help:"ping 填 4"})),
      m(".row",Btn({label:"执行",busy:st.busy,onclick:run}),m("span.hint","最长约 30 秒")),
      m("pre",{style:"margin-top:12px"},st.out)));
  }};
};

/* ---- 备份与恢复：/etc/config 逐文件读写（刻意不做固件刷写） ---- */
PAGES.bk=function(){
  var st={busyExp:false,text:"",name:"",msg:"",msgErr:false};
  var f=mkf(st);
  var SEP="\n##### molly-config: ";
  function nm(n){var s=(typeof n==="string")?n:((n&&n.name)||"");return s.split("/").pop();}
  function say(m,err){st.msg=m;st.msgErr=!!err;}
  function expo(){st.busyExp=true;st.text="读取中…";m.redraw();
    rpc("file","list",{path:"/etc/config"}).then(function(r){var raw=((r&&r.entries)||[]).map(nm).filter(Boolean);
      var ns=raw.filter(function(n){return n.indexOf(".conf")<0;});if(!ns.length)ns=raw;
      var chain=Promise.resolve(["# molly 配置备份  "+new Date().toISOString()]);var got=0;
      ns.forEach(function(n){chain=chain.then(function(acc){return rpc("file","read",{path:"/etc/config/"+n}).then(function(x){acc.push(SEP+"file:"+n);acc.push((x&&x.data)||"");got++;return acc;}).catch(function(){return acc;});});});
      return chain.then(function(acc){st.text=acc.join("\n");got?say("已导出 "+got+" 个文件"):say("导出失败：读不到任何配置文件",true);});})
      .catch(function(e){say("导出失败："+e.message,true);})
      .then(function(){st.busyExp=false;m.redraw();});}
  function copy(){if(!(st.text||"").trim()){say("先导出",true);m.redraw();return;}
    var done=function(){say("已复制");m.redraw();};
    var fb=function(){var el=document.getElementById("bkarea");if(el){el.select();try{document.execCommand("copy");done();}catch(e){say("复制失败，请手动全选",true);m.redraw();}}};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(st.text).then(done).catch(fb);else fb();}
  function download(){if(!(st.text||"").trim()){say("先导出",true);m.redraw();return;}
    var a=document.createElement("a");a.href="data:text/plain;charset=utf-8,"+encodeURIComponent(st.text);a.download="molly-config-"+new Date().toISOString().slice(0,19).replace(/[:T]/g,"")+".txt";a.click();}
  function restore(){var n=(st.name||"").trim();
    if(!n){say("请填要恢复的配置名",true);m.redraw();return;}
    var eh=vcheck(V.host(n));if(eh){say("配置名只能用字母数字 . _ -",true);m.redraw();return;}
    var lines=(st.text||"").split("\n"),parts=[],cur=null;
    lines.forEach(function(l){if(l.indexOf(SEP+"file:")===0){cur={name:l.slice((SEP+"file:").length),body:[]};parts.push(cur);}else if(cur)cur.body.push(l);});
    var target=parts.filter(function(p){return p.name===n;})[0];
    if(!target){say("备份里没有 "+n+" 这一段",true);m.redraw();return;}
    confirmDialog({title:"恢复配置",message:"将覆盖 /etc/config/"+n+" 并 reload_config，网络会短暂中断。确定？",danger:true,ok:"恢复并生效"}).then(function(y){if(!y)return;
      rpc("file","write",{path:"/etc/config/"+n,data:target.body.join("\n").replace(/\n+$/,"")+"\n",mode:420})
        .then(function(){return rpc("file","exec",{command:"/sbin/reload_config",params:[]}).catch(function(){return null;});})
        .then(function(){say(n+" 已恢复并生效");m.redraw();}).catch(function(e){say("恢复失败："+e.message,true);m.redraw();});});}
  return {view:function(){
    return m("div",[
      m("section.card",m("h2","配置备份"),
        m(".sub","导出 /etc/config 下的配置文件文本。"),
        m(".row",Btn({label:"导出",busy:st.busyExp,onclick:expo}),Btn({label:"复制",variant:"out",onclick:copy}),Btn({label:"下载 .txt",variant:"out",onclick:download})),
        st.msg?m(".msg-inline",(st.msgErr?"✕ ":"✓ ")+st.msg):null,
        m("textarea#bkarea",{placeholder:"点「导出」后这里会出现备份内容",value:st.text,style:"margin-top:12px",oninput:function(e){st.text=e.target.value;}})),
      m("section.card",m("h2","配置恢复"),
        m(".sub","把上面导出的文本按同名文件写回 /etc/config。同名 = 覆盖，不会删别的文件。"),
        f("name","要恢复的配置（文件名）",{help:"如 network"}),
        m(".row",Btn({label:"恢复并生效",variant:"danger",onclick:restore}))),
      m("section.card",m("h2","固件升级"),
        m(".sub","刻意不在网页里做：刷固件不可逆，请走 sysupgrade 命令或专家版升级页（有校验与中断保护）。"))
    ]);
  }};
};

/* ============ 路由与挂载 ============ */
var routes={};
MENU.forEach(function(mp){routes["/"+mp.id]={render:function(){return Layout(mp.id);}};});
if(!routes["/dash"])routes["/dash"]={render:function(){return Layout("dash");}};
function boot(){
  var root=document.getElementById("app");
  if(!auth.sid){m.render(root,m(".layout",m("main"),m(LoginOverlay)));m.render(document.getElementById("dialog-host"),renderDialog());return;}
  m.route.prefix="#";
  var seg=(location.hash&&location.hash.replace(/^#\/?/,""))||((MENU[0]&&MENU[0].id)||"dash");
  m.route(root,"/"+seg,routes);
  // snackbar / dialog 常驻层
  var sh=document.getElementById("snackbar-host"),dh=document.getElementById("dialog-host"),ah=document.getElementById("auth-host");
  var paint=function(){m.render(sh,renderSnack());m.render(dh,renderDialog());m.render(ah,auth.login?m(LoginOverlay):null);};
  var r1=m.redraw; m.redraw=function(){r1();paint();}; paint();
}
boot();
})();
